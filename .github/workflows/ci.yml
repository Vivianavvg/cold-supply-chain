name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write BigQuery service account key
        run: echo "$GCP_SA_KEY" > /tmp/gcp-sa-key.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: dbt deps
        run: dbt deps

      - name: dbt build (dev dataset)
        run: dbt build --target ci
        env:
          DBT_GCP_KEYFILE: /tmp/gcp-sa-key.json
          DBT_PROJECT: ${{ secrets.GCP_PROJECT }}
          DBT_DATASET: coldchain_dev
