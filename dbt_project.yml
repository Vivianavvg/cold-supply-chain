name: 'coldchain_analytics'
version: '0.1.0'
config-version: 2

profile: 'coldchain_analytics'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Minutes a leg must spend outside the product's safe temp range before
  # spoilage_risk_flag is true. Example threshold from spec 4.3.
  spoilage_risk_minutes_threshold: 30

models:
  coldchain_analytics:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
